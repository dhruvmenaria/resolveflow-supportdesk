services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resolveflow
      POSTGRES_USER: resolveflow
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveflow -d resolveflow"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://resolveflow:local-demo-only@db:5432/resolveflow
      JWT_SECRET: local-compose-secret-change-before-sharing
      DEMO_USERNAME: demo
      DEMO_PASSWORD: change-this-password
    depends_on:
      db:
        condition: service_healthy
