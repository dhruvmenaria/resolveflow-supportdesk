[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveflow"
version = "0.1.0"
description = "Grounded multilingual support workflow demo with approvals and translation memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "asgi-lifespan>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["resolveflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
